apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.longhorn.io
    chart: longhorn
    targetRevision: 1.9.1
    helm:
      valuesObject:
        # the pre-upgrade hook job deadlocks under argocd (needs a serviceaccount
        # that only exists after the main sync) — longhorn docs say disable it for gitops
        preUpgradeChecker:
          jobEnabled: false
        # single worker node in the lab — one replica, more when GPU/extra nodes join
        defaultSettings:
          defaultReplicaCount: 1
        persistence:
          defaultClass: true
          defaultClassReplicaCount: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
