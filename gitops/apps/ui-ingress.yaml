apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ui-ingress
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/babakDoraniArab/alohomora.git
    targetRevision: main
    path: gitops/platform/ingress
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
