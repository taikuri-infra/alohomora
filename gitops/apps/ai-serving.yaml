apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-serving
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/babakDoraniArab/alohomora.git
    targetRevision: main
    path: gitops/platform/ai
  destination:
    server: https://kubernetes.default.svc
    namespace: ai
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
