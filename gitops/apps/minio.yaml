apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.min.io/
    chart: minio
    targetRevision: 5.4.0
    helm:
      valuesObject:
        mode: standalone
        replicas: 1
        # root credentials come from a pre-created Secret (never in git);
        # created by scripts/create-minio-secret.sh — Vault + External Secrets later
        existingSecret: minio-root-creds
        persistence:
          enabled: true
          storageClass: longhorn
          size: 10Gi
        resources:
          requests:
            memory: 512Mi
        buckets:
          - name: models        # vLLM model weights live here — GPU nodes stay disposable
            policy: none
            purge: false
  destination:
    server: https://kubernetes.default.svc
    namespace: minio
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
