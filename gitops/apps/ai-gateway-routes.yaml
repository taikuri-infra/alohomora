apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-gateway-routes
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/babakDoraniArab/alohomora.git
    targetRevision: main
    path: gitops/platform/ai-gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: ai
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # CRDs arrive from the ai-gateway-crds app — retry until they exist
    retry:
      limit: 8
      backoff: { duration: 20s, factor: 2, maxDuration: 3m }
