apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
spec:
  project: default
  source:
    repoURL: registry-1.docker.io/envoyproxy
    chart: gateway-helm
    targetRevision: v1.9.0
    helm:
      valuesObject:
        # base values Envoy AI Gateway requires (from ai-gateway/manifests/envoy-gateway-values.yaml)
        config:
          envoyGateway:
            gateway:
              controllerName: gateway.envoyproxy.io/gatewayclass-controller
            logging:
              level:
                default: info
            provider:
              type: Kubernetes
            extensionApis:
              enableEnvoyPatchPolicy: true
              enableBackend: true          # Backend API for AI service backends
            # AI Gateway fine-tunes the xDS that Envoy Gateway generates
            extensionManager:
              hooks:
                xdsTranslator:
                  translation:
                    listener: { includeAll: true }
                    route: { includeAll: true }
                    cluster: { includeAll: true }
                    secret: { includeAll: true }
                  post:
                    - Translation
                    - Cluster
                    - Route
              service:
                fqdn:
                  hostname: ai-gateway-controller.envoy-ai-gateway-system.svc.cluster.local
                  port: 1063
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
