apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-gateway-crds
  namespace: argocd
spec:
  project: default
  source:
    repoURL: registry-1.docker.io/envoyproxy
    chart: ai-gateway-crds-helm
    targetRevision: v1.1.0
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-ai-gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-gateway
  namespace: argocd
spec:
  project: default
  source:
    repoURL: registry-1.docker.io/envoyproxy
    chart: ai-gateway-helm
    targetRevision: v1.1.0
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-ai-gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 6
      backoff: { duration: 20s, factor: 2, maxDuration: 3m }
