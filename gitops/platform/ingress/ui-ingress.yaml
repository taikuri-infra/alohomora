# All web UIs behind the shared cilium-ingress LB (192.168.105.231).
# nip.io resolves <name>.192.168.105.231.nip.io to the IP — no /etc/hosts edits.
# HTTP only for now; TLS via cert-manager comes with a real domain.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
spec:
  rules:
    - host: grafana.192.168.105.231.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: monitoring-grafana, port: { number: 80 } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
