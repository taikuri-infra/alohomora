---
# Alohomora Phase 1 — k3s HA (embedded etcd) + kube-vip + Cilium
# Run: cd ansible && ansible-playbook site.yml

- name: Bootstrap first server (cp1)
  hosts: server_init
  become: true
  tasks:
    - name: Ensure k3s config dir
      file: { path: /etc/rancher/k3s, state: directory, mode: "0755" }

    - name: Write k3s config (cluster-init)
      template:
        src: templates/k3s-config-server-init.yaml.j2
        dest: /etc/rancher/k3s/config.yaml
        mode: "0600"

    - name: Install k3s server
      shell: curl -sfL https://get.k3s.io | INSTALL_K3S_CHANNEL={{ k3s_channel }} sh -s - server
      args: { creates: /usr/local/bin/k3s }

    - name: Wait for API server /readyz
      command: k3s kubectl get --raw /readyz
      register: readyz
      until: readyz.rc == 0
      retries: 30
      delay: 10
      changed_when: false

- name: Join remaining servers (cp2, cp3)
  hosts: server_join
  serial: 1
  become: true
  tasks:
    - name: Ensure k3s config dir
      file: { path: /etc/rancher/k3s, state: directory, mode: "0755" }

    - name: Write k3s config (server join)
      template:
        src: templates/k3s-config-server-join.yaml.j2
        dest: /etc/rancher/k3s/config.yaml
        mode: "0600"

    - name: Install k3s server
      shell: curl -sfL https://get.k3s.io | INSTALL_K3S_CHANNEL={{ k3s_channel }} sh -s - server
      args: { creates: /usr/local/bin/k3s }

    - name: Wait for this node to register
      command: k3s kubectl get node {{ inventory_hostname }}
      register: nodereg
      until: nodereg.rc == 0
      retries: 30
      delay: 10
      changed_when: false

- name: Install Cilium, kube-vip, LB pool (from cp1)
  hosts: server_init
  become: true
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  tasks:
    - name: Install helm
      shell: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args: { creates: /usr/local/bin/helm }

    - name: Write cilium values
      template:
        src: templates/cilium-values.yaml.j2
        dest: /root/cilium-values.yaml
        mode: "0644"

    - name: Add cilium helm repo
      command: helm repo add cilium https://helm.cilium.io
      register: repoadd
      changed_when: "'already exists' not in repoadd.stderr"
      failed_when: repoadd.rc != 0 and 'already exists' not in repoadd.stderr

    - name: Install Cilium
      command: >
        helm upgrade --install cilium cilium/cilium
        --version {{ cilium_version }}
        --namespace kube-system
        --values /root/cilium-values.yaml
        --wait --timeout 10m

    - name: Wait for all nodes Ready
      shell: k3s kubectl get nodes --no-headers | awk '$2 != "Ready"' | wc -l
      register: notready
      until: notready.stdout | trim == "0"
      retries: 30
      delay: 10
      changed_when: false

    - name: Deploy kube-vip (k3s auto-applies manifests dir)
      template:
        src: templates/kube-vip.yaml.j2
        dest: /var/lib/rancher/k3s/server/manifests/kube-vip.yaml
        mode: "0644"

    - name: Wait for API VIP to answer
      command: ping -c1 -W2 {{ api_vip }}
      register: vipping
      until: vipping.rc == 0
      retries: 30
      delay: 5
      changed_when: false

    - name: Repoint Cilium at the VIP (HA API access)
      command: >
        helm upgrade cilium cilium/cilium
        --version {{ cilium_version }}
        --namespace kube-system
        --reuse-values
        --set k8sServiceHost={{ api_vip }}
        --wait --timeout 5m

    - name: Deploy Cilium LB pool + L2 announcement policy
      template:
        src: templates/cilium-lb.yaml.j2
        dest: /var/lib/rancher/k3s/server/manifests/cilium-lb.yaml
        mode: "0644"

- name: Join worker nodes
  hosts: workers
  become: true
  tasks:
    - name: Ensure k3s config dir
      file: { path: /etc/rancher/k3s, state: directory, mode: "0755" }

    - name: Write k3s config (agent)
      template:
        src: templates/k3s-config-agent.yaml.j2
        dest: /etc/rancher/k3s/config.yaml
        mode: "0600"

    - name: Install k3s agent
      shell: curl -sfL https://get.k3s.io | INSTALL_K3S_CHANNEL={{ k3s_channel }} sh -s - agent
      args: { creates: /usr/local/bin/k3s }

- name: Fetch kubeconfig to the Mac
  hosts: server_init
  become: true
  tasks:
    - name: Read kubeconfig
      slurp: { src: /etc/rancher/k3s/k3s.yaml }
      register: kubecfg

    - name: Write ./kubeconfig locally (API via VIP)
      copy:
        content: "{{ kubecfg.content | b64decode | replace('127.0.0.1', api_vip) }}"
        dest: "{{ playbook_dir }}/../kubeconfig"
        mode: "0600"
      delegate_to: localhost
      become: false

    - name: Final check — all nodes
      command: k3s kubectl get nodes -o wide
      register: nodes
      changed_when: false

    - debug: { var: nodes.stdout_lines }
